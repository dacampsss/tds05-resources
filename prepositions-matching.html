<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepositions Matching Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #fca5a5; /* Red base for halftone */
            background-image: radial-gradient(#f87171 20%, transparent 20%), radial-gradient(#f87171 20%, transparent 20%);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            font-weight: 700;
        }

        .font-comic {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }

        .comic-box {
            border: 4px solid #000;
            box-shadow: 6px 6px 0 #000;
            border-radius: 8px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .comic-box:hover:not(.connected) {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 #000;
        }

        .comic-box:active {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0 #000;
        }

        .comic-btn {
            background-color: #fbbf24;
            border: 4px solid #000;
            box-shadow: 4px 4px 0 #000;
            text-transform: uppercase;
            transition: all 0.1s;
        }
        
        .comic-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }

        .comic-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        /* SVG Line styling */
        .conn-line {
            transition: stroke-width 0.2s ease, filter 0.2s ease;
        }
        .conn-line.highlight {
            filter: drop-shadow(0px 0px 4px currentColor) brightness(1.2);
            stroke-width: 10 !important;
            z-index: 10;
        }

        /* Selection borders */
        .selected-L, .selected-R, .selected-M {
            background-color: #fef08a !important; /* yellow highlight */
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0 #000 !important;
        }
        
        /* Middle items distinct style */
        .mid-item {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            letter-spacing: 0.1em;
            background-color: #fff;
        }

        /* New animations for the share button */
        .animate-comic-pulse {
            animation: comic-pulse 1s infinite;
        }
        @keyframes comic-pulse {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }
    </style>
</head>
<body class="relative min-h-screen text-slate-900 overflow-x-hidden">

    <!-- Floating Tooltip for Connection Number -->
    <div id="tooltip" class="absolute hidden border-4 border-black rounded-full w-8 h-8 flex items-center justify-center font-bold text-lg shadow-[2px_2px_0_#000] pointer-events-none transition-opacity duration-200 z-50">
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-white font-comic text-2xl px-6 py-2 border-4 border-black shadow-[4px_4px_0_#000] z-50 hidden transition-opacity">
        🔗 LINK COPIED!
    </div>

    <!-- Main Content Container -->
    <main class="relative z-10 max-w-7xl mx-auto py-8 min-h-screen flex flex-col">
        
        <!-- Header & Instructions -->
        <header class="text-center mb-6 bg-white p-6 comic-box max-w-3xl mx-auto w-[calc(100%-2rem)]">
            <h1 class="text-5xl font-comic text-slate-900 mb-3 uppercase drop-shadow-[2px_2px_0_#fff]">Prepositions Connection</h1>
            <p class="text-xl font-bold">
                Connect the sentence parts using the correct preposition!
            </p>
            <p class="text-sm font-bold text-slate-600 mt-2">
                Click a left card, a middle word, and a right card. Click a connected card to delete.
            </p>
            
            <!-- Hidden Share Container -->
            <div id="share-container" class="hidden flex-col items-center mt-6">
                <!-- Speech Bubble -->
                <div class="relative bg-white border-4 border-black px-5 py-2 mb-4 rounded-xl shadow-[4px_4px_0_#000] font-comic text-2xl text-center text-blue-600 animate-bounce">
                    All connected! Share your result!
                    <div class="absolute -bottom-[14px] left-1/2 -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-t-[10px] border-t-black border-r-[10px] border-r-transparent"></div>
                    <div class="absolute -bottom-[8px] left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-t-[6px] border-t-white border-r-[6px] border-r-transparent"></div>
                </div>
                <!-- Pulsing Button -->
                <button onclick="generateShareLink()" class="comic-btn font-comic text-3xl px-8 py-3 rounded-full cursor-pointer animate-comic-pulse text-slate-900 bg-green-400">
                    Share My Answers!
                </button>
            </div>
        </header>

        <!-- Horizontal Scroll Wrapper (Forces columns to remain side-by-side) -->
        <div class="w-full overflow-x-auto pb-10 px-4">
            
            <!-- Game Board Wrapper (sets coordinate space for SVG) -->
            <div id="board-wrapper" class="relative min-w-[960px] max-w-5xl mx-auto">
                
                <!-- Background SVG Layer -->
                <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none" style="z-index: 0;"></svg>

                <!-- Game Board Columns -->
                <div class="grid grid-cols-[1fr_auto_1fr] gap-6 lg:gap-16 items-center place-content-center relative z-10 py-4">
                    <!-- Left Column: Sentence Starters -->
                    <div id="col-L" class="flex flex-col gap-4 w-full"></div>
                    
                    <!-- Middle Column: Prepositions -->
                    <div id="col-M" class="flex flex-col gap-8 justify-center items-center py-8 px-4"></div>
                    
                    <!-- Right Column: Sentence Endings -->
                    <div id="col-R" class="flex flex-col gap-4 w-full"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- 1. Data Definitions ---
        
        const leftItemsData = [
            { id: 'L1', text: '1. We bought a new server' },
            { id: 'L2', text: '2. Please check the log files' },
            { id: 'L3', text: '3. Download the source code' },
            { id: 'L4', text: '4. We are looking for a developer' },
            { id: 'L5', text: '5. I just received an email' },
            { id: 'L6', text: '6. The front panel' }
        ];

        const midItemsData = [
            { id: 'M1', text: 'OF' },
            { id: 'M2', text: 'WITH' },
            { id: 'M3', text: 'FROM' }
        ];

        const rightItemsData = [
            { id: 'R1', text: 'a) the official GitHub repository.' },
            { id: 'R2', text: 'b) two redundant power supplies.' },
            { id: 'R3', text: 'c) the main web application.' },
            { id: 'R4', text: 'd) our cloud provider about downtime.' },
            { id: 'R5', text: 'e) strong troubleshooting skills.' },
            { id: 'R6', text: 'f) the router has four LED indicators.' }
        ];

        // Vibrant comic colors
        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f97316', '#a855f7', '#06b6d4', '#eab308'];

        // --- 2. Game State ---
        
        let connections = []; // Array of { id, L, M, R, color, num }
        let currentSelection = { L: null, M: null, R: null };
        let connectionCounter = 1;
        let colorIndex = 0;

        // --- 3. Initialization & Rendering DOM ---

        function initGame() {
            // Check for state to determine if we should shuffle
            const params = new URLSearchParams(window.location.search);
            const stateStr = params.get('state');
            
            let finalRight = [...rightItemsData];
            if (!stateStr) {
                // Shuffle right items only if it's a fresh game
                finalRight = finalRight.sort(() => Math.random() - 0.5);
            }

            renderColumn('col-L', leftItemsData, 'L');
            renderColumn('col-M', midItemsData, 'M');
            renderColumn('col-R', finalRight, 'R');

            // Listen for window resizes to redraw SVG lines correctly
            window.addEventListener('resize', drawAllConnections);
            
            if (stateStr) {
                loadStateFromURL(stateStr);
            }
            
            checkGameCompletion();
        }

        // --- 3.7 Completion Check logic ---
        
        function checkGameCompletion() {
            const totalLeft = leftItemsData.length;
            // Check how many unique left items have a connection
            const connectedLeftCount = new Set(connections.map(c => c.L)).size;
            
            const shareContainer = document.getElementById('share-container');
            if (connectedLeftCount === totalLeft) {
                // Reveal the share section
                shareContainer.classList.remove('hidden');
                shareContainer.classList.add('flex');
            } else {
                // Hide the share section
                shareContainer.classList.add('hidden');
                shareContainer.classList.remove('flex');
            }
        }

        function renderColumn(containerId, data, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; // clear

            data.forEach(item => {
                const div = document.createElement('div');
                div.id = item.id;
                div.className = `card comic-box relative bg-white z-10 text-center cursor-pointer transition-colors`;
                
                // Specific styling for Middle Prepositions
                if (type === 'M') {
                    div.className += ' mid-item text-slate-900 bg-white hover:bg-slate-100 px-8 py-4';
                } else {
                    div.className += ' text-slate-900 text-xl bg-white min-h-[4.5rem] flex items-center justify-center px-4 leading-tight';
                }
                
                div.innerText = item.text;

                // Click event
                div.addEventListener('click', () => handleCardClick(type, item.id));

                // Hover events for highlighting connected lines (mostly for Left/Right)
                div.addEventListener('mouseenter', (e) => handleHoverStart(type, item.id, e.target));
                div.addEventListener('mouseleave', () => handleHoverEnd(type, item.id));

                container.appendChild(div);
            });
        }
        
        // --- 3.5 Share functionality ---
        
        function generateShareLink() {
            const stateStr = connections.map(c => `${c.L}-${c.M}-${c.R}`).join('|');
            const url = new URL(window.location.href);
            url.searchParams.set('state', stateStr);
            const shareUrl = url.toString();
            
            const textArea = document.createElement("textarea");
            textArea.value = shareUrl;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
            window.history.replaceState({}, '', shareUrl);
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function loadStateFromURL(stateStr) {
            const conns = stateStr.split('|');
            conns.forEach(c => {
                const parts = c.split('-');
                if (parts.length === 3) {
                    currentSelection = { L: parts[0], M: parts[1], R: parts[2] };
                    createConnection();
                }
            });
        }

        // --- 4. Interaction Logic ---

        function handleCardClick(type, id) {
            const cardEl = document.getElementById(id);

            // 1. If clicking a Left or Right item that is already connected, delete its connection
            if (type === 'L' || type === 'R') {
                const existingConn = connections.find(c => c[type] === id);
                if (existingConn) {
                    deleteConnection(existingConn.id);
                    return; // Stop here, freeing up the item
                }
            }

            // 2. Toggle Selection
            if (currentSelection[type] === id) {
                // Deselect if clicking the currently selected item
                currentSelection[type] = null;
            } else {
                // Select the new item
                currentSelection[type] = id;
            }

            updateSelectionUI();

            // 3. Check if all three parts are selected to form a new connection
            if (currentSelection.L && currentSelection.M && currentSelection.R) {
                createConnection();
            }
        }

        function createConnection() {
            // Assign unique ID, color, and number
            const connId = `conn-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            const color = colors[colorIndex % colors.length];
            colorIndex++;

            const newConn = {
                id: connId,
                L: currentSelection.L,
                M: currentSelection.M,
                R: currentSelection.R,
                color: color,
                num: connectionCounter++
            };

            connections.push(newConn);

            // Mark L and R as permanently connected in the UI
            markConnectedUI(currentSelection.L, color);
            markConnectedUI(currentSelection.R, color);

            // Clear current selection
            currentSelection = { L: null, M: null, R: null };
            updateSelectionUI();

            // Draw the lines
            drawAllConnections();
            
            // Check if all lines are connected to show Share button
            checkGameCompletion();
        }

        function deleteConnection(connId) {
            const conn = connections.find(c => c.id === connId);
            if (!conn) return;

            // Remove visual connected state from L and R
            unmarkConnectedUI(conn.L);
            unmarkConnectedUI(conn.R);

            // Remove from array
            connections = connections.filter(c => c.id !== connId);

            // Hide tooltip just in case it was triggered during deletion click
            hideTooltip();

            // Redraw remaining lines
            drawAllConnections();
            
            // Re-evaluate game completion
            checkGameCompletion();
        }

        // --- 5. UI Updating & Styling ---

        function updateSelectionUI() {
            // Remove selection styles from all
            document.querySelectorAll('.card').forEach(el => {
                el.classList.remove('selected-L', 'selected-M', 'selected-R');
            });

            // Add selection style to currently selected ones
            if (currentSelection.L) document.getElementById(currentSelection.L).classList.add('selected-L');
            if (currentSelection.M) document.getElementById(currentSelection.M).classList.add('selected-M');
            if (currentSelection.R) document.getElementById(currentSelection.R).classList.add('selected-R');
        }

        function markConnectedUI(id, color) {
            const el = document.getElementById(id);
            el.classList.add('connected');
            el.style.backgroundColor = color;
            el.style.color = '#fff';
            el.style.textShadow = '2px 2px 0 #000'; // comic text shadow
        }

        function unmarkConnectedUI(id) {
            const el = document.getElementById(id);
            el.classList.remove('connected');
            el.style.backgroundColor = '';
            el.style.color = '';
            el.style.textShadow = '';
        }

        // --- 6. Hover & Tooltip Logic ---

        function handleHoverStart(type, id, element) {
            // Find all connections that include this item
            const activeConns = connections.filter(c => c.L === id || c.R === id || c.M === id);
            
            if (activeConns.length > 0) {
                activeConns.forEach(conn => {
                    // Highlight the SVG colored lines for this connection
                    const lines = document.querySelectorAll(`.line-${conn.id}`);
                    lines.forEach(line => line.classList.add('highlight'));
                });

                // Display tooltip only if we hovered a specific Left or Right item
                if (type === 'L' || type === 'R') {
                    const conn = activeConns[0];
                    showTooltip(element, conn.num, conn.color);
                }
            }
        }

        function handleHoverEnd(type, id) {
            // Remove highlight classes
            document.querySelectorAll('.conn-line').forEach(line => line.classList.remove('highlight'));
            hideTooltip();
        }

        const tooltip = document.getElementById('tooltip');

        function showTooltip(element, number, color) {
            const rect = element.getBoundingClientRect();
            tooltip.innerHTML = number;
            tooltip.style.backgroundColor = color;
            tooltip.style.color = '#fff';
            tooltip.style.textShadow = '1px 1px 0 #000';
            tooltip.classList.remove('hidden');

            // Position tooltip dynamically near the top-right corner of the hovered element
            const topPos = rect.top + window.scrollY - 15;
            const leftPos = rect.right + window.scrollX - 15;
            
            tooltip.style.top = `${topPos}px`;
            tooltip.style.left = `${leftPos}px`;
        }

        function hideTooltip() {
            tooltip.classList.add('hidden');
        }

        // --- 7. SVG Drawing Logic ---

        function drawAllConnections() {
            const svg = document.getElementById('svg-layer');
            svg.innerHTML = ''; // Clear existing paths

            // Draw thick black outlines first (so they sit behind the colored strokes)
            connections.forEach(conn => drawConnectionPath(conn, svg, true));
            // Draw vibrant colored strokes on top
            connections.forEach(conn => drawConnectionPath(conn, svg, false));
        }

        function drawConnectionPath(conn, svg, isOutline) {
            const elL = document.getElementById(conn.L);
            const elM = document.getElementById(conn.M);
            const elR = document.getElementById(conn.R);
            const boardWrapper = document.getElementById('board-wrapper');

            if (!elL || !elM || !elR || !boardWrapper) return; // safeguard

            const rectL = elL.getBoundingClientRect();
            const rectM = elM.getBoundingClientRect();
            const rectR = elR.getBoundingClientRect();
            const rectW = boardWrapper.getBoundingClientRect();

            // Calculate connection points relative to the board-wrapper bounds 
            // (eliminates the need for manual window.scrollX adjustments)
            const lPoint = {
                x: rectL.right - rectW.left,
                y: rectL.top - rectW.top + (rectL.height / 2)
            };
            const mLeftPoint = {
                x: rectM.left - rectW.left,
                y: rectM.top - rectW.top + (rectM.height / 2)
            };
            const mRightPoint = {
                x: rectM.right - rectW.left,
                y: rectM.top - rectW.top + (rectM.height / 2)
            };
            const rPoint = {
                x: rectR.left - rectW.left,
                y: rectR.top - rectW.top + (rectR.height / 2)
            };

            // Draw Path 1: Left to Mid
            svg.appendChild(createBezierCurve(lPoint, mLeftPoint, conn.color, conn.id, isOutline));
            // Draw Path 2: Mid to Right
            svg.appendChild(createBezierCurve(mRightPoint, rPoint, conn.color, conn.id, isOutline));
        }

        function createBezierCurve(start, end, color, connId, isOutline) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            // Calculate bezier control points for a smooth horizontal S-curve
            const deltaX = Math.abs(end.x - start.x) * 0.5;
            const cp1 = { x: start.x + deltaX, y: start.y };
            const cp2 = { x: end.x - deltaX, y: end.y };

            const d = `M ${start.x} ${start.y} C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${end.x} ${end.y}`;

            path.setAttribute('d', d);
            path.setAttribute('fill', 'none');
            
            if (isOutline) {
                path.setAttribute('stroke', '#000');
                path.setAttribute('stroke-width', '14'); // Thicker outline
                path.setAttribute('class', 'outline-line');
            } else {
                path.setAttribute('stroke', color);
                path.setAttribute('stroke-width', '6'); // Inner color
                path.setAttribute('class', `conn-line line-${connId}`);
                path.style.color = color; // For the currentColor highlight filter
            }

            return path;
        }

        // Start game when DOM is ready
        document.addEventListener('DOMContentLoaded', initGame);

    </script>
</body>
</html>
